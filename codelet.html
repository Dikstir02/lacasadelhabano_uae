  <script>
    lucide.createIcons();

    const header = document.querySelector(".site-header");
    window.addEventListener("scroll", () => header.classList.toggle("scrolled", window.scrollY > 25));

    const menu = document.getElementById("mobile-menu");
    const openMenu = document.getElementById("menu-button");
    const closeMenu = document.getElementById("menu-close");
    openMenu.addEventListener("click", () => { menu.classList.add("open"); openMenu.setAttribute("aria-expanded", "true"); });
    closeMenu.addEventListener("click", () => { menu.classList.remove("open"); openMenu.setAttribute("aria-expanded", "false"); });
    document.querySelectorAll("#mobile-menu a").forEach(link => link.addEventListener("click", () => closeMenu.click()));

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("visible"); });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(element => observer.observe(element));

    const slides = [...document.querySelectorAll(".event-slide")];
    const dots = [...document.querySelectorAll(".event-dot")];
    let currentSlide = 0;
    let autoplay;
    function showSlide(index) {
      currentSlide = (index + slides.length) % slides.length;
      slides.forEach((slide, i) => slide.classList.toggle("active", i === currentSlide));
      dots.forEach((dot, i) => dot.classList.toggle("active", i === currentSlide));
    }
    function startAutoplay() { autoplay = setInterval(() => showSlide(currentSlide + 1), 6000); }
    document.getElementById("next-event").addEventListener("click", () => showSlide(currentSlide + 1));
    document.getElementById("prev-event").addEventListener("click", () => showSlide(currentSlide - 1));
    dots.forEach((dot, index) => dot.addEventListener("click", () => showSlide(index)));
    const carousel = document.getElementById("event-carousel");
    carousel.addEventListener("mouseenter", () => clearInterval(autoplay));
    carousel.addEventListener("mouseleave", startAutoplay);
    let touchStart = 0;
    carousel.addEventListener("touchstart", event => { touchStart = event.touches[0].clientX; });
    carousel.addEventListener("touchend", event => {
      const difference = event.changedTouches[0].clientX - touchStart;
      if (Math.abs(difference) > 45) showSlide(currentSlide + (difference < 0 ? 1 : -1));
    });
    startAutoplay();

    document.querySelectorAll(".location-contact").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("location").value = button.dataset.location;
        const mapQuery = encodeURIComponent(`${button.dataset.location}, United Arab Emirates`);
        window.open(`https://www.google.com/maps/search/?api=1&query=${mapQuery}`, "_blank", "noopener,noreferrer");
        document.getElementById("contact").scrollIntoView({ behavior: "smooth" });
      });
    });

    let recordCount = 0;
    const form = document.getElementById("enquiry-form");
    const status = document.getElementById("form-status");
    const submit = document.getElementById("submit-button");

    const handler = {
      onDataChanged(data) {
        recordCount = data.length;
      }
    };

    async function initialiseData() {
      const result = await window.dataSdk.init(handler);
      if (!result.isOk) status.textContent = "Our enquiry service is temporarily unavailable. Please contact us directly.";
    }
    initialiseData();

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!form.checkValidity()) {
        status.textContent = "Please complete all fields correctly.";
        form.reportValidity();
        return;
      }
      if (recordCount >= 999) {
        status.textContent = "Enquiry capacity has been reached. Please contact us by WhatsApp.";
        return;
      }
      submit.disabled = true;
      status.textContent = "Sending your enquiry…";
      const result = await window.dataSdk.create({
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        location: document.getElementById("location").value,
        message: document.getElementById("message").value.trim(),
        submitted_at: new Date().toISOString()
      });
      if (result.isOk) {
        form.reset();
        status.textContent = "Gracias — your enquiry has been received.";
      } else {
        status.textContent = "We could not send your enquiry. Please try WhatsApp.";
      }
      submit.disabled = false;
    });
  </script>
